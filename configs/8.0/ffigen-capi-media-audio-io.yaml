name: Tizen80CapiMediaAudioIo
description: Dart bindings for Tizen capi-media-audio-io APIs.
output: ../../lib/src/bindings/8.0/generated_bindings_capi_media_audio_io.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-capi-media-audio-io.h
  include-directives:
  - '**/audio_io.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/8.0/usr/include/
- -I./rootstraps/8.0/usr/include/media/
enums:
  rename:
    _+(.*): $1
