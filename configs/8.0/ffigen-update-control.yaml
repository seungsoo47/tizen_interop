name: Tizen80UpdateControl
description: Dart bindings for Tizen update-control APIs.
output: ../../lib/src/bindings/8.0/generated_bindings_update_control.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-update-control.h
  include-directives:
  - '**/update_control.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/8.0/usr/include/
- -I./rootstraps/8.0/usr/include/system/
enums:
  rename:
    _+(.*): $1
