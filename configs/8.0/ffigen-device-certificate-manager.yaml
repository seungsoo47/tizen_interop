name: Tizen80DeviceCertificateManager
description: Dart bindings for Tizen device-certificate-manager APIs.
output: ../../lib/src/bindings/8.0/generated_bindings_device_certificate_manager.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-device-certificate-manager.h
  include-directives:
  - '**/device_certificate_manager.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/8.0/usr/include/
- -I./rootstraps/8.0/usr/include/device-certificate-manager/
enums:
  rename:
    _+(.*): $1
