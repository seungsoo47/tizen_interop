name: Tizen80RpcPort
description: Dart bindings for Tizen rpc-port APIs.
output: ../../lib/src/bindings/8.0/generated_bindings_rpc_port.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-rpc-port.h
  include-directives:
  - '**/rpc-port.h'
  - '**/rpc-port-parcel.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/8.0/usr/include/
- -I./rootstraps/8.0/usr/include/appfw/
- -I./rootstraps/8.0/usr/include/rpc-port/
enums:
  rename:
    _+(.*): $1
