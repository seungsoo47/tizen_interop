name: Tizen80DataControl
description: Dart bindings for Tizen data-control APIs.
output: ../../lib/src/bindings/8.0/generated_bindings_data_control.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-data-control.h
  include-directives:
  - '**/data_control.h'
  - '**/data_control_sql.h'
  - '**/data_control_map.h'
  - '**/data_control_provider.h'
  - '**/data_control_noti.h'
  - '**/data_control_bulk.h'
  - '**/data_control_sql_cursor.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/8.0/usr/include/
- -I./rootstraps/8.0/usr/include/appfw/
enums:
  rename:
    _+(.*): $1
