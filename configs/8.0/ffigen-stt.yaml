name: Tizen80Stt
description: Dart bindings for Tizen stt APIs.
output: ../../lib/src/bindings/8.0/generated_bindings_stt.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-stt.h
  include-directives:
  - '**/stt.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/8.0/usr/include/
- -I./rootstraps/8.0/usr/include/stt/
enums:
  rename:
    _+(.*): $1
