name: Tizen80AppcoreAgent
description: Dart bindings for Tizen appcore-agent APIs.
output: ../../lib/src/bindings/8.0/generated_bindings_appcore_agent.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-appcore-agent.h
  include-directives:
  - '**/service_app.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/8.0/usr/include/
- -I./rootstraps/8.0/usr/include/appcore-agent/
- -I./rootstraps/8.0/usr/include/appfw/
enums:
  rename:
    _+(.*): $1
