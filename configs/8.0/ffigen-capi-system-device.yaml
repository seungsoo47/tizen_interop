name: Tizen80CapiSystemDevice
description: Dart bindings for Tizen capi-system-device APIs.
output: ../../lib/src/bindings/8.0/generated_bindings_capi_system_device.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-capi-system-device.h
  include-directives:
  - '**/device/*.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/8.0/usr/include/
enums:
  rename:
    _+(.*): $1
