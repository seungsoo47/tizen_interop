name: Tizen80CapiGeofenceManager
description: Dart bindings for Tizen capi-geofence-manager APIs.
output: ../../lib/src/bindings/8.0/generated_bindings_capi_geofence_manager.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-capi-geofence-manager.h
  include-directives:
  - '**/geofence_manager.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/8.0/usr/include/
- -I./rootstraps/8.0/usr/include/geofence/
enums:
  rename:
    _+(.*): $1
