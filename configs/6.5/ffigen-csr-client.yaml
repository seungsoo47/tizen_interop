name: Tizen65CsrClient
description: Dart bindings for Tizen csr-client APIs.
output: ../../lib/src/bindings/6.5/generated_bindings_csr_client.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-csr-client.h
  include-directives:
  - '**/csr/*.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/6.5/usr/include/
- -I./rootstraps/6.5/usr/include/csr/
enums:
  rename:
    _+(.*): $1
