name: Tizen65CapiMediaCamera
description: Dart bindings for Tizen capi-media-camera APIs.
output: ../../lib/src/bindings/6.5/generated_bindings_capi_media_camera.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-capi-media-camera.h
  include-directives:
  - '**/camera.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/6.5/usr/include/
- -I./rootstraps/6.5/usr/include/media/
enums:
  rename:
    _+(.*): $1
