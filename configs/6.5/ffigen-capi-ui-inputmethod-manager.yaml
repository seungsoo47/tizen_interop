name: Tizen65CapiUiInputmethodManager
description: Dart bindings for Tizen capi-ui-inputmethod-manager APIs.
output: ../../lib/src/bindings/6.5/generated_bindings_capi_ui_inputmethod_manager.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-capi-ui-inputmethod-manager.h
  include-directives:
  - '**/inputmethod_manager.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/6.5/usr/include/
- -I./rootstraps/6.5/usr/include/inputmethod/
enums:
  rename:
    _+(.*): $1
