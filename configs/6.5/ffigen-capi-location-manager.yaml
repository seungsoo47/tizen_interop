name: Tizen65CapiLocationManager
description: Dart bindings for Tizen capi-location-manager APIs.
output: ../../lib/src/bindings/6.5/generated_bindings_capi_location_manager.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-capi-location-manager.h
  include-directives:
  - '**/locations.h'
  - '**/location_bounds.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/6.5/usr/include/
- -I./rootstraps/6.5/usr/include/location/
enums:
  rename:
    _+(.*): $1
