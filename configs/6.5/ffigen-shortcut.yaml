name: Tizen65Shortcut
description: Dart bindings for Tizen shortcut APIs.
output: ../../lib/src/bindings/6.5/generated_bindings_shortcut.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-shortcut.h
  include-directives:
  - '**/shortcut_manager.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/6.5/usr/include/
- -I./rootstraps/6.5/usr/include/appfw/
- -I./rootstraps/6.5/usr/include/shortcut/
enums:
  rename:
    _+(.*): $1
