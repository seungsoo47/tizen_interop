name: Tizen65CapiMediaController
description: Dart bindings for Tizen capi-media-controller APIs.
output: ../../lib/src/bindings/6.5/generated_bindings_capi_media_controller.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-capi-media-controller.h
  include-directives:
  - '**/media_controller_client.h'
  - '**/media_controller_metadata.h'
  - '**/media_controller_playlist.h'
  - '**/media_controller_server.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/6.5/usr/include/
- -I./rootstraps/6.5/usr/include/media/
enums:
  rename:
    _+(.*): $1
