name: Tizen65CapiAppfwAppControl
description: Dart bindings for Tizen capi-appfw-app-control APIs.
output: ../../lib/src/bindings/6.5/generated_bindings_capi_appfw_app_control.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-capi-appfw-app-control.h
  include-directives:
  - '**/app_control.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/6.5/usr/include/
- -I./rootstraps/6.5/usr/include/appfw/
enums:
  rename:
    _+(.*): $1
