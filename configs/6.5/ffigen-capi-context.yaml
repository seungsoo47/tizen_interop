name: Tizen65CapiContext
description: Dart bindings for Tizen capi-context APIs.
output: ../../lib/src/bindings/6.5/generated_bindings_capi_context.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-capi-context.h
  include-directives:
  - '**/context_history.h'
  - '**/context_trigger.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/6.5/usr/include/
- -I./rootstraps/6.5/usr/include/context-service/
- -I./rootstraps/6.5/usr/include/appfw/
enums:
  rename:
    _+(.*): $1
