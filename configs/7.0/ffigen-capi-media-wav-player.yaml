name: Tizen70CapiMediaWavPlayer
description: Dart bindings for Tizen capi-media-wav-player APIs.
output: ../../lib/src/bindings/7.0/generated_bindings_capi_media_wav_player.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-capi-media-wav-player.h
  include-directives:
  - '**/wav_player.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/7.0/usr/include/
- -I./rootstraps/7.0/usr/include/media/
enums:
  rename:
    _+(.*): $1
