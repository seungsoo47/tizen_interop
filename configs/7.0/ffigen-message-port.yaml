name: Tizen70MessagePort
description: Dart bindings for Tizen message-port APIs.
output: ../../lib/src/bindings/7.0/generated_bindings_message_port.dart
llvm-path:
- /usr/lib/llvm-12
headers:
  entry-points:
  - entrypoints-message-port.h
  include-directives:
  - '**/message_port.h'
compiler-opts:
- -m32
- -Wno-incomplete-setjmp-declaration
- -I./rootstraps/7.0/usr/include/
- -I./rootstraps/7.0/usr/include/appfw/
enums:
  rename:
    _+(.*): $1
